<p>Opening the sample…<br><a id="pdf" href="/work/concept-review-sample.pdf">Open the PDF</a></p>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script>
  // 방문 한 번이 analytics에 잡힐 시간을 조금 주고 PDF로 넘긴다(스크립트가 늦거나 막혀도 1.5초면 넘어감).
  (function(){
    var done=false, go=function(){ if(done) return; done=true; location.replace('/work/concept-review-sample.pdf'); };
    var s=document.createElement('script'); s.defer=true; s.src='/_vercel/insights/script.js';
    s.onload=function(){ setTimeout(go, 400); }; s.onerror=go;
    document.head.appendChild(s);
    setTimeout(go, 1500);
  })();
</script>
